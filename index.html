<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Совпадение — SiXeS Помощник</title>
  <meta name="description"
    content="Помощник для настольной игры «Совпадение» (SiXeS)." />
  <meta property="og:title" content="Совпадение — SiXeS Помощник" />
  <meta property="og:description"
    content="Помощник для настольной игры «Совпадение» (SiXeS)." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#13231d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SiXeS" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
    rel="stylesheet">
</head>

<body
  class="bg-[#f6f5f0] text-[#18231f] antialiased select-none selection:bg-[#31594b] selection:text-white min-h-screen flex flex-col font-sans">
  <!-- Static Semantic Header -->
  <header class="sticky top-0 z-40 w-full bg-[#111c19] text-white border-b border-[#20312b] shadow-xs">
    <div class="max-w-4xl mx-auto px-2.5 sm:px-4 h-13 sm:h-16 flex items-center justify-between gap-1.5 sm:gap-2">
      <!-- Brand -->
      <button id="brandLink" type="button" aria-label="Вернуться в главное меню"
        class="flex items-center gap-2 sm:gap-3 text-left group cursor-pointer focus:outline-hidden text-inherit no-underline min-w-0 shrink bg-transparent border-0 p-0">
        <div
          class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg sm:rounded-xl border border-[#90a297]/40 bg-[#192722] flex items-center justify-center font-extrabold text-base sm:text-lg text-[#e3c174] group-hover:scale-105 transition-transform shrink-0">
          6
        </div>
        <div class="min-w-0">
          <div
            class="font-extrabold text-xs sm:text-base tracking-tight leading-tight flex items-center gap-1.5 truncate">
            <span class="truncate">СОВпадение</span>
          </div>

        </div>
      </button>

      <!-- Center In-Game Round indicator -->


      <!-- Actions -->
      <div class="flex items-center gap-1 sm:gap-1.5 shrink-0">
        <!-- Sound Toggle -->
        <button id="soundBtn"
          class="min-w-[36px] min-h-[36px] sm:min-w-[40px] sm:min-h-[40px] p-1.5 sm:p-2 rounded-lg sm:rounded-xl text-white/80 hover:text-white hover:bg-white/10 active:scale-95 transition-all flex items-center justify-center cursor-pointer"
          title="Звук">
          <svg class="w-4 h-4 text-[#e3c174]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z" />
          </svg>
        </button>

        <!-- Vibration Toggle -->
        <button id="vibrateBtn"
          class="min-w-[36px] min-h-[36px] sm:min-w-[40px] sm:min-h-[40px] p-1.5 sm:p-2 rounded-lg sm:rounded-xl text-white/80 hover:text-white hover:bg-white/10 active:scale-95 transition-all flex items-center justify-center cursor-pointer"
          title="Вибрация">
          <svg class="w-4 h-4 text-[#e3c174]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m2 8 2 2-2 2 2 2-2 2" />
            <path d="m22 8-2 2 2 2-2 2 2 2" />
            <rect width="8" height="14" x="8" y="5" rx="1" />
          </svg>
        </button>

        <!-- Screen Awake Toggle -->
        <button id="wakeLockBtn"
          class="min-w-[36px] min-h-[36px] sm:min-w-[40px] sm:min-h-[40px] p-1.5 sm:p-2 rounded-lg sm:rounded-xl text-white/80 hover:text-white hover:bg-white/10 active:scale-95 transition-all flex items-center justify-center cursor-pointer"
          title="Экран включен">
          <svg class="w-4 h-4 text-[#e3c174]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </button>

        <!-- Rules button -->
        <button id="rulesBtn"
          class="min-w-[36px] min-h-[36px] sm:min-w-[40px] sm:min-h-[40px] p-1.5 sm:p-2 rounded-lg sm:rounded-xl text-white/80 hover:text-white hover:bg-white/10 active:scale-95 transition-all flex items-center justify-center cursor-pointer font-bold text-sm"
          title="Правила">
          ?
        </button>

        <!-- Language Toggle -->
        <button id="langBtn"
          class="min-h-[34px] sm:min-h-[38px] px-2.5 py-1 rounded-full border border-white/20 bg-white/5 hover:bg-white/15 active:scale-95 text-[11px] font-extrabold tracking-wider text-white transition-all cursor-pointer flex items-center justify-center">
          EN
        </button>
      </div>
    </div>
  </header>

  <!-- Main dynamic application root -->
  <main id="app" class="flex-1 pb-16"></main>

  <!-- Modal for rules -->
  <div id="rulesModal"></div>
  <div id="homeConfirmModal"></div>
  <div id="topicChoiceModal"></div>
  <div id="pwaInstallModal"></div>
  <div id="offlineToast"></div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
